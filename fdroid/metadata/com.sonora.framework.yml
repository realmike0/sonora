AutoName: Sonora Framework
Summary: Account manager for Sonora
Description: |-
  Sonora Framework is the invisible companion of Sonora (no launcher icon).
  It manages your Sonora ID accounts: change password, connected devices,
  change email and multiple accounts, also from Android's account settings.
  Install it together with Sonora.
