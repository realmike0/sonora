name: Build iOS IPA

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Genera il progetto
        working-directory: ios
        run: xcodegen generate
      - name: Compila (senza firma)
        working-directory: ios
        run: |
          xcodebuild -project Sonora.xcodeproj -scheme Sonora -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Crea IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Sonora.app Payload/
          zip -qr Sonora-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Sonora-ios-ipa
          path: Sonora-ios.ipa
