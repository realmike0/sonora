name: Build Sonora Admin

# Solo a mano (Actions → Build Sonora Admin → Run workflow). L'APK admin non va nelle release pubbliche.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :admin:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SonoraAdmin
          path: admin/build/outputs/apk/release/admin-release.apk
          retention-days: 7
